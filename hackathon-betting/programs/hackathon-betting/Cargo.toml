[package]
name = "hackathon-betting"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hackathon_betting"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Used only in bankrun tests — replaces PROTOCOL_ADMIN with the local test wallet
# so initialize_hackathon / whitelist_wallet can be called without the real admin key.
testing = []


[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl  = "0.31.0"

